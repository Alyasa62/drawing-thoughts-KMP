name: KMP Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # CRITICAL: Triggers workflow when you push a tag like v1.0
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 17 is required for modern Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # FIX: Grants permission to run the gradle script
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 1. Run Unit Tests (Optional but recommended)
      - name: Run Android Tests
        run: ./gradlew :composeApp:testDebugUnitTest
        continue-on-error: true

      # 2. Build the Android APK
      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug

      # 3. Rename the APK to "DrawingThoughts.apk"
      - name: Rename APK
        run: |
          mv composeApp/build/outputs/apk/debug/composeApp-debug.apk composeApp/build/outputs/apk/debug/DrawingThoughts.apk

      # 4. Upload the APK to GitHub Artifacts (Temporary storage)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrawingThoughts-APK
          path: composeApp/build/outputs/apk/debug/DrawingThoughts.apk

  build-desktop:
    name: Build Desktop (Linux/Deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # FIX: Grants permission to run the gradle script
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 1. Run Desktop Tests
      - name: Run Desktop Tests
        run: ./gradlew :composeApp:jvmTest
        continue-on-error: true

      # 2. Build the Linux .deb package
      - name: Package Desktop App (Linux)
        run: ./gradlew :composeApp:packageDeb

      # 3. Upload Linux Artifact (THIS WAS THE BROKEN STEP)
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawingThoughts-Linux-Deb
          path: composeApp/build/compose/binaries/main/deb/*.deb

  # RELEASE JOB: Only runs when a tag (v*) is pushed
  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop] # Waits for builds to finish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only runs on tags like v1.0
    permissions:
      contents: write
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DrawingThoughts-APK
          path: ./artifacts/android

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DrawingThoughts-Linux-Deb
          path: ./artifacts/desktop

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/android/DrawingThoughts.apk
            ./artifacts/desktop/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}