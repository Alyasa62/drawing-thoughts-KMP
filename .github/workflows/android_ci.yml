name: Android CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (Required for compileSdk 36 / AGP 8+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 3. Configure Gradle cache and optimizations
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Grant execute permission for the Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Build project and run Unit Tests
      # This task compiles the code and ensures dependencies like Hilt/Kapt resolve correctly
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # 6. (Optional) Archive the Debug APK
      # Allows you to download the built APK from GitHub Actions after a successful run
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
